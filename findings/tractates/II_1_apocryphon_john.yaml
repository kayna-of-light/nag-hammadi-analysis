  - id: AJ-018
    category: structural_principle
    passage: >
      "And the powers began: the first one, goodness, created a bone-soul;
      and the second, foreknowledge, created a sinew-soul; the third,
      divinity, created a flesh-soul; and the fourth, the lordship,
      created a marrow-soul; the fifth, kingdom created a blood-soul;
      the sixth, envy, created a skin-soul; the seventh, understanding,
      created a hair-soul."
    location: "Line 103"
    finding: >
      The seven substance-souls are the PRIMARY PRINCIPLES from which
      the entire 365-community map derives. Their ORDER is not arbitrary
      — it traces a derivation from innermost structural foundation to
      outermost emanation:

      1. GOODNESS → bone = absolute structural foundation
      2. FOREKNOWLEDGE → sinew = connection between structures
      3. DIVINITY → flesh = substance filling the connected structure
      4. LORDSHIP → marrow = generative life INSIDE the foundation
      5. KINGDOM → blood = circulation distributing what marrow generates
      6. ENVY → skin = boundary containing it all (the proprium)
      7. UNDERSTANDING → hair = outermost emanation beyond the boundary

      The first five are qualities of LOVE/WILL. The sixth is the
      SELF-BOUNDARY (proprium). The seventh and last is UNDERSTANDING.
      This exactly mirrors Swedenborg's ontological priority of will
      over understanding — will/love is the foundation (1st), and
      understanding is the outermost derivative (7th).

      The sixth placement is critical: ENVY creates SKIN. Envy =
      awareness of separation between self and other. Skin = the
      physical separation between self and world. The quality that
      generates the experience of "I am not you" is the same quality
      that generates the body's boundary. This IS the proprium encoded
      as a substance-soul — and it is SIXTH, not first. The proprium
      derives from goodness; goodness does not derive from the proprium.
      But the proprium is necessary (without skin, no containment).

      The nesting of 4th inside 1st is precise: lordship (marrow)
      lives INSIDE goodness (bone). The lord dwells within the
      structural foundation. Marrow generates blood cells from within
      bone. What the lord generates (marrow→blood), the kingdom
      distributes to all.

      Every body part in the 365-angel list is a specific
      differentiation of these seven substances. The head-to-feet
      order of the body list then traces how influx flows from the
      primary receiving organ to the most ultimate expression. The
      whole structure reads as: seven primary spiritual communities →
      365 differentiated communities → head-to-feet derivation order →
      governance hierarchy (overseers→senses→elements→passions).
