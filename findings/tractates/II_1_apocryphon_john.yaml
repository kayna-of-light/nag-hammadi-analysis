  - id: AJ-007
    category: structural_principle
    passage: >
      "The origin of the demons which are in the whole body is determined
      to be four: heat, cold, wetness, and dryness... The four chief demons
      are: Ephememphi who belongs to pleasure, Yoko who belongs to desire,
      Nenentophni who belongs to grief, Blaomen who belongs to fear."
    location: "Lines 117-119"
    finding: >
      Four elemental qualities (heat/cold/wet/dry) map to four fundamental
      passions (pleasure/desire/grief/fear). This is a systematic architecture
      of the affective life — not random demonology but a correspondence map
      of the human emotional structure. The four elements are the natural
      substrate; the four passions are the spiritual reality operating through them.
    principles:
      - correspondence
      - divine_human
    confidence: strong
    notes: >
      The Hippocratic four-humour system may derive from the same ancient
