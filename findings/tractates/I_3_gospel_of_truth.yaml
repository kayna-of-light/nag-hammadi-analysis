tractate: "I,3"
title: "The Gospel of Truth"
filename: "I_3_gospel_of_truth.md"
status: in_progress
richness: extraordinary

summary: >
  A meditation on knowledge and ignorance written in sustained correspondential
  prose. The text describes ignorance as fog, anguish as something that "grew
  solid," the Living Book as containing complete thoughts in each letter, and
  fragrance as the Spirit proceeding from the Father. The dream/sleep/waking
  extended metaphor is one of the most developed in the collection. The shepherd
  leaving 99 for 1 is decoded numerologically (99→100 = left hand to right hand =
  incomplete to complete). The text operates at such a high correspondential
  register that every sentence contains multiple layers.

findings:
  - id: GV-001
    category: correspondence
    passage: >
      "Ignorance of the Father brought about anguish and terror; and
      the anguish grew solid like a fog, so that no one was able to see."
    location: "Opening"
    finding: >
      Ignorance = fog. Anguish as something that "grew solid" — the emotional
      effect of ignorance condenses into perceptual obstruction. You cannot
      see because the anguish OF ignorance has become a medium that blocks
      sight. This is correspondence applied to epistemology: ignorance is not
      simply absence of knowledge — it produces a substance (fog) that
      actively prevents perception.
    principles:
      - correspondence
    confidence: strong
    notes: ""

  - id: GV-002
    category: explicit_statement
    passage: >
      "There was manifested in their heart the living book of the living —
      the one written in the thought and the mind of the Father, which from
      before the foundation of the totality was within his incomprehensibility
      — that book which no one was able to take... Each letter is a complete
      thought, like a complete book, since they are letters written by the
      Unity, the Father having written them for the aeons."
    location: "Middle section"
    finding: >
      The "Living Book" is not a text — it is the totality of divine thought
      manifested in hearts. Each "letter" is a complete thought, a complete
      book — there are no fragments in the divine writing. This is knowledge
      preserved in form: each element contains the whole, as a seed contains
      the tree. The book cannot be "taken" because it is not an object but
      a living reality that manifests in those who receive it.
    principles:
      - correspondence
      - ancient_word
      - influx
    confidence: strong
    notes: >
      "Letters written by the Unity" — each natural form (letter) is a
      complete expression of the whole (Unity). This is the holographic
      principle of correspondence: the whole is in every part.

  - id: GV-003
    category: structural_principle
    passage: >
      The text develops an extended dream/sleep/waking metaphor: those in
      ignorance are as though in nightmares — running, striking, being
      struck, falling, flying — all without substance. Then the Spirit
      "pursued" the sleeping person, extended a hand, set them on their feet.
    location: "Dream passage"
    finding: >
      Sleep = ignorance. Waking = knowledge of the Father. The nightmares
      of the sleeping are not random — they are the confused perceptions of
      the natural mind operating without spiritual illumination. The Spirit
      pursuing the sleeper and setting them upright is influx described as
      rescue from the dream-state. Knowledge is not acquired — it is
      awakening from ignorance.
    principles:
      - correspondence
      - influx
      - regeneration
    confidence: strong
    notes: ""

  - id: GV-004
    category: correspondence
    passage: >
      "Now the name of the Father is the Son."
    location: "Late section"
    finding: >
      The Name = the identity/being in its communicable form. The Father (the
      infinite, unknowable source) makes himself known through the Son (the
      Name = the manifest identity). Name is not a label but a spiritual
      reality — the way being becomes accessible. This is influx described
      as naming: the interior (Father) is expressed through the exterior (Son/Name).
    principles:
      - influx
      - discrete_degrees
    confidence: strong
    notes: ""

  - id: GV-005
    category: correspondence
    passage: >
      "He became a path for those who were lost and knowledge for those
      who were ignorant, a discovery for those who were searching, and a
      support for those who were wavering, immaculateness for those who
      were defiled."
    location: "Middle section"
    finding: >
      The same reality (Christ/the Son) appears differently to each
      receiver according to their need: path to the lost, knowledge to
      the ignorant, discovery to the seeker, support to the wavering,
      purity to the defiled. This is constant state (one reality) variable
      form (perceived according to the receiver's condition). The Son is
      not five different things — he is one thing received five ways.
    principles:
      - constant_state_variable_form
      - accommodation
    confidence: strong
    notes: >
      Compare Philip: "Jesus appeared to each according to their capacity."
