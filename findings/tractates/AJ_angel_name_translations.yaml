material_soul_head:

  - name: "Anaro"
    faculty: "insight into the true character of passions"
    roots:
      - language: Greek
        root: "ἀνά (ana) = up/back + ὁράω (horaō) = to see"
        meaning: "the one who sees back / the one who looks up"
    synthesis: >
      Insight (the capacity to see the true nature of passions) is
      named "seeing-back" or "seeing-upward." To see truly IS to look
      back toward the source — to see the correspondence rather than
      only the surface. Anaro is the faculty of CORRESPONDENTIAL
      PERCEPTION: seeing the spiritual reality behind/above the
      natural appearance.
    confidence: strong

# =============================================================================
# SUMMARY
# =============================================================================
#
# Confidence distribution across all translated names:
#   strong:    ~20 names (clear roots, precise semantic fit)
#   moderate:  ~20 names (probable roots, plausible fit)
#   tentative: ~18 names (possible roots, speculative)
#   opaque:    ~4 names (no clear decomposition)
#
# Languages represented: Greek (dominant), Hebrew/Aramaic, Egyptian, mixed
#
# Key patterns discovered:
#
# 1. ANATOMICAL SELF-NAMING: Some angels are simply named with the anatomical
#    term (Meniggesstroeth = meninges, Knyx = knēmē/shin). The spiritual
#    power IS the natural form — the name confirms the correspondence.
#
# 2. FUNCTIONAL NAMING: Most names encode the FUNCTION of the body part at
#    the spiritual degree — not what it looks like, but what it DOES
#    (Asterechme = star-holder for the eye, Biblo = book for the kidneys).
#
# 3. DEITY COGNATES: Where a name shares a root with a deity (Chnoumeninorin/
#    Khnum, Athuro/Hathor), the relationship is not derivation but shared
#    correspondence — the deity and the angel both express the same spiritual
#    principle at different degrees. The deity is the principle perceived
#    through mythological/fallen cognition; the angel name is the principle
#    encoded in correspondential form.
#
# 4. GREEK PHILOSOPHICAL COMPOUNDS: The passion-rulers and their mother
#    (Aesthesis-Ouch-Epi-Ptoe) are Greek philosophical definitions in
#    angel-name dress — evidence of a community thinking in Greek
#    philosophical categories while encoding in correspondential form.
#
# 5. HEBREW THEOPHORIC NAMES: Several names contain אל (El) = God
#    (Achiel, Boabel), encoding the divine presence at each body part.
#
# 6. MULTILINGUAL CONVERGENCE: The list moves fluidly between Greek,
#    Hebrew, and Egyptian roots — evidence of a scholarly community
#    operating at the intersection of these traditions, consistent with
#    the claim of direct access to the "book of Zoroaster" (AJ-009).
#
# 7. GRAND MAN CARTOGRAPHY: The entire list is a MAP OF SPIRITUAL
#    QUALITIES organized through the human form — each name captures
#    a spiritual quality, each quality gives rise to a community of
#    beings who share it, each community sustains a body part in
#    ultimates. Their interrelation mirrors the relational structure
#    of heaven. This is Swedenborg's Maximus Homo (HH §§59-102) encoded
#    in angel-name form from a pre-Christian tradition that had direct
#    access to the same knowledge. The convergence is not borrowing — it
#    is independent observation of the same structure.
