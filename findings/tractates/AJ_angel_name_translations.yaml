  - name: "Blaomen"
    passion: "fear"
    roots:
      - language: Greek
        root: "βλάπτω (blaptō) = to harm + μένος (menos) = spirit/force"
        meaning: "harm-spirit / the spirit of damage"
    synthesis: >
      Fear as the anticipation of harm to one's spirit — not mere
      physical danger but the threat of damage to what animates.
      Fear IS the perception of approaching spiritual harm.
    confidence: moderate

  - name: "Aesthesis-Ouch-Epi-Ptoe"
    passion: "mother of all passions"
    roots:
      - language: Greek (compound)
        root: >
          αἴσθησις (aisthēsis) = sensation/perception
          + οὐχ (ouch) = not
          + ἐπί (epi) = upon
          + πτόη (ptoē) = alarm/fright
        meaning: "sensation-not-upon-alarm"
    synthesis: >
      The MOTHER of all four passions is NEUTRAL SENSATION prior to its
      polarization. "Sensation not upon alarm" = perception before it
      has been activated by any of the four passion-triggers. This is
      the undifferentiated perceptual field from which pleasure, desire,
      grief, and fear emerge as four specializations. The name is a
      complete philosophical definition compressed into angel-name form.
      This is the most sophisticated name in the entire list — a Greek
      compound that is simultaneously a taxonomy and a correspondence.
    confidence: strong

