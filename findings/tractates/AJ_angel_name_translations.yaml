regional_overseers:

  - name: "Diolimodraza"
    body_region: "head"
    roots:
      - language: Greek
        root: "possibly Δίος (Dios) = of Zeus/divine + λῖμος (limos) = hunger + δράζω (drazō) = to grasp"
        meaning: "divine-hunger-grasper"
    synthesis: >
      The head as the seat of divine hunger — the mind's appetite for
      truth. The head grasps what it hungers for.
    confidence: tentative

  - name: "Yammeax"
    body_region: "neck"
    roots:
      - language: Hebrew
        root: "ים (yam) = sea + מאך (?)"
        meaning: "sea-related?"
    synthesis: >
      The neck as the narrow passage between head and body — as a
      strait connects to the sea. Tentative.
    confidence: tentative

  - name: "Yakouib"
    body_region: "right shoulder"
    roots:
      - language: Hebrew
        root: "יעקב (Ya'aqov) = Jacob"
        meaning: "the one who grasps the heel / the wrestler"
    synthesis: >
      Jacob = the one who wrestles, who grasps, who bears. The right
      shoulder bears the weight and wrestles against what opposes. Jacob
      wrestled the angel at the Jabbok — the shoulder that contends with
      the divine. Profound: Jacob's story IS the correspondence for what
      the shoulder does.
    confidence: strong

  - name: "Pisandriaptes"
    body_region: "chest"
    roots:
      - language: Greek
        root: "πιστός (pistos) = faithful + ἀνδρ- (andr-) = man + ἅπτω (haptō) = to touch"
        meaning: "faithful-man-toucher / the touching of the faithful man"
    synthesis: >
      The chest as the place where faithfulness touches the person —
      where interior commitment (faith) makes contact with the exterior
      world. The heart within the chest is the seat of fidelity.
    confidence: moderate

  - name: "Bathinoth"
    body_region: "all genitals"
    roots:
      - language: Greek/Hebrew
        root: "βάθος (bathos) = depth + possibly נוח (noach) = rest"
        meaning: "depth of rest"
    synthesis: >
      The generative organs as the DEPTH where creation rests in
      potential — the deepest function awaiting activation.
    confidence: tentative

  - name: "Aroer"
    coptic_form: "ⲁⲣ̅ⲟ̅ⲏ̅ⲣ̅ ⲧⲥⲏⲃⲉ ⲛ̅ϭⲃⲟⲩⲣ (LEFT shin — Robinson had 'right')"
    body_region: "left shin-bone"
    roots:
      - language: Hebrew
        root: "ערער (Aroer) = a known biblical place name meaning 'ruins' or 'juniper'"
        meaning: "stripped bare / exposed"
    synthesis: >
      LATERALITY CORRECTION: The Coptic manuscript assigns Aroer to
      the LEFT shin (ⲧⲥⲏⲃⲉ ⲛ̅ϭⲃⲟⲩⲣ), not the right as in Robinson.
      The shin as the exposed bone — the least protected, most
      vulnerable part of the leg. Aroer = ruins, what is laid bare.
    confidence: moderate

