# =============================================================================
# SECTION 4: RULERS OF THE FOUR ELEMENTS = THE SPIRITUAL COMPASS
# =============================================================================
#
# These four are NOT merely material properties (temperature, humidity).
# They ARE the four cardinal directions of the spiritual world — the
# same compass Swedenborg maps in Heaven and Hell:
#
#   EAST  = Heat  (love/good, the Lord as Sun)
#   WEST  = Cold  (diminished love, distance from the source)
#   SOUTH = Wet   (truth in full light, flowing uninterrupted)
#   NORTH = Dry   (truth absent/obscure, the desert of ignorance)
#
# The "mother" of these four, Onorthochrasaei, "stands in their midst
# since she is illimitable, and she mixes with all of them. And she is
# truly matter." MATTER IS THE CENTER where all four directions meet.
# The material body exists at the crossroads of all four spiritual
# orientations.
#
# The body does not merely HAVE heat, cold, dryness, and wetness as
# material properties — it is POSITIONED within the four cardinal
# directions of the spiritual world. These rulers describe the body's
# orientation, not its chemistry.

elemental_rulers:

  - name: "Phloxopha"
    element: "heat"
    compass: "EAST"
    roots:
      - language: Greek
        root: "φλόξ (phlox) = flame + σοφία (sophia) = wisdom"
        meaning: "flame-wisdom / the wisdom of fire"
    synthesis: >
      EAST = the Lord as Sun = the source of love. The angel of heat
      is named Flame-Wisdom: the fire of love IS wisdom at its source.
      Phloxopha governs the body's warmth, which is not mere temperature
      but the natural expression of the divine fire of love operating
      in ultimates. The name itself encodes the East — where love (flame)
      and wisdom (sophia) are one.
    confidence: strong

  - name: "Oroorrothos"
    element: "cold"
    compass: "WEST"
    roots:
      - language: Greek
        root: "reduplicated ὄρος (oros) = boundary/limit + ῥόθος (rothos) = rushing"
        meaning: "boundary upon boundary of rushing"
      - language: Greek
        root: "ὀρρωδέω (orrōdeō) = to dread, to shrink back"
        meaning: "the shrinking-back"
    synthesis: >
      WEST = where the Sun sets, where love withdraws, where the rush
      of life contracts. The reduplicated form IS the definition: oros-
      oros-rothos = boundary repeating upon boundary, with the rush of
      life constrained within them. The West is where the East's
      outward fire meets limit after limit. If the orrōdeō root is
      present: "the shrinking-back rushing" — energy that retreats.
      Both readings converge: the West is the direction of withdrawal,
      contraction, and cooling. Not evil — the necessary opposite pole
      to the East's fire. When the ruling love (East) is good, the
      West is positive natural expression; when East is self-love,
      the West becomes spiritual coldness.
    confidence: moderate

  - name: "Erimacho"
    element: "dryness"
    compass: "NORTH"
    roots:
      - language: Greek
        root: "ἔρημος (erēmos) = desert/abandoned/desolate + μάχη (machē) = battle/struggle"
        meaning: "desert-battle / the battleground of desolation"
    synthesis: >
      NORTH = truth in obscurity, where understanding is dim and
      truth is scarce. Dryness = absence of water = absence of truth.
      The desert is the landscape of spiritual ignorance — where truth
      cannot be found, where the seeker struggles in darkness. The name
      encodes the EXPERIENCE of the North: ἔρημος (abandoned/desolate)
      + μάχη (battle) = the struggle that occurs when truth has
      withdrawn. The North is the desert where you fight to find what
      the South receives freely. Not evil — the necessary condition
      where faith must carry what sight cannot yet confirm.
    confidence: strong

  - name: "Athuro"
    element: "wetness"
    compass: "SOUTH"
    roots:
      - language: Egyptian
        root: "Hathor (Ḥwt-Ḥr) = 'House of Horus' = the house where the light-principle dwells"
        meaning: "the house of light"
    synthesis: >
      SOUTH = truth in full light, flowing uninterrupted. Water =
      truth; wetness = truth abundant. The South is where truth pours
      in without obstruction — the noon Sun of understanding. The
      Egyptian etymology is precise: Ḥwt (house) + Ḥr (Horus, the
      light-principle). The South IS the house where light is AT HOME
      — fully present, fully flowing, nourishing everything it
      reaches. Truth at its fullest is wet: it irrigates, sustains,
      brings every living thing to bloom. The deity Hathor perceived
      at the Egyptian cultural degree is NOT the source — the
      principle of truth-fully-present-and-flowing exists at the
      spiritual level; both are the same reality at different degrees.
      The nourishing quality of Hathor IS the nourishing quality of
      unobstructed truth.
    confidence: moderate

  - name: "Onorthochrasaei"
    element: "mother of the four / matter"
    compass: "CENTER"
    roots:
      - language: Greek
        root: "ὀρθο- (ortho-) = straight/correct + χράω (chraō) = to give oracles; or χράομαι (chraomai) = to use/mix"
        meaning: "the straight-mixing one / the one of correct use"
    synthesis: >
      THE CENTER. "She stands in their midst since she is illimitable,
      and she mixes with all of them. And she is truly matter." If
      ortho- + chraomai: matter is what MIXES all four directions into
      a single correct (ortho) form — the straight blending of East,
      West, South, North into ultimate expression. She makes the
      mixture UPRIGHT — correct, balanced. The material body sits at
      the crossroads. She "mixes with all" because every material
      thing participates in all four directions simultaneously in
      varying proportions. She is "illimitable" because no point in
      the material world escapes this intersection. If chraō (oracle):
      matter is where the four directions SPEAK — where the spiritual
      compass becomes legible in natural form.
    confidence: moderate

