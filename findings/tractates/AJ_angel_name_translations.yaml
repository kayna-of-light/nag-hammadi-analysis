# SECTION 3: RULERS OF SENSES AND FACULTIES
# =============================================================================

faculty_rulers:

  - name: "Archendekta"
    faculty: "the senses"
    roots:
      - language: Greek
        root: "ἀρχή (archē) = ruler + ἐν (en) = in + δέκτης (dektēs) = receiver"
        meaning: "chief-in-receiver / ruler of the reception faculty"
    synthesis: >
      The senses as the chief receiving apparatus — the primary
      instrument through which the world enters the person. The ruler
      of the senses is the ruler of reception itself.
    confidence: strong

  - name: "Deitharbathas"
    faculty: "receptions"
    roots:
      - language: Greek
        root: "possibly δεῖ (dei) = it is necessary + θαρβέω (tharbeō) = to be amazed"
        meaning: "necessary amazement"
    synthesis: >
      Reception as necessary amazement — to receive the world properly
      requires wonder. The faculty of reception is grounded in the
      capacity to be amazed.
    confidence: tentative

  - name: "Oummaa"
    faculty: "imagination"
    roots:
      - language: Coptic/Egyptian
        root: "possibly from Egyptian wḥm = to repeat/reflect"
        meaning: "reflector / repeater"
    synthesis: >
      Imagination as the faculty that REFLECTS — repeats in inner form
      what was received from outside. The image-making capacity is a
      reflection-organ.
    confidence: tentative

  - name: "Aachiaram"
    faculty: "composition"
    roots:
      - language: Greek/Hebrew
        root: "possibly from achi (Hebrew: brother) + aram (height)"
        meaning: "brother of the height"
    synthesis: >
      Composition — the faculty that assembles parts into wholes — as
      the brother of height. To compose is to elevate fragments into
      a higher unity.
    confidence: tentative

  - name: "Riaramnacho"
    faculty: "the whole impulse"
    roots:
      - language: mixed
        root: "uncertain; possibly contains aram + nachos"
        meaning: "uncertain"
    confidence: opaque

# =============================================================================
# SECTION 4: RULERS OF THE FOUR ELEMENTS = THE SPIRITUAL COMPASS
# =============================================================================
#
# These four are NOT merely material properties (temperature, humidity).
# They ARE the four cardinal directions of the spiritual world — the
# same compass Swedenborg maps in Heaven and Hell:
#
#   EAST  = Heat  (love/good, the Lord as Sun)
#   WEST  = Cold  (diminished love, distance from the source)
#   SOUTH = Wet   (truth in full light, flowing uninterrupted)
#   NORTH = Dry   (truth absent/obscure, the desert of ignorance)
#
# The "mother" of these four, Onorthochrasaei, "stands in their midst
# since she is illimitable, and she mixes with all of them. And she is
# truly matter." MATTER IS THE CENTER where all four directions meet.
# The material body exists at the crossroads of all four spiritual
# orientations.
#
# The body does not merely HAVE heat, cold, dryness, and wetness as
# material properties — it is POSITIONED within the four cardinal
# directions of the spiritual world. These rulers describe the body's
# orientation, not its chemistry.

elemental_rulers:

  - name: "Phloxopha"
    element: "heat"
    compass: "EAST"
    roots:
      - language: Greek
        root: "φλόξ (phlox) = flame + σοφία (sophia) = wisdom"
        meaning: "flame-wisdom / the wisdom of fire"
    synthesis: >
      EAST = the Lord as Sun = the source of love. The angel of heat
      is named Flame-Wisdom: the fire of love IS wisdom at its source.
      Phloxopha governs the body's warmth, which is not mere temperature
      but the natural expression of the divine fire of love operating
      in ultimates. The name itself encodes the East — where love (flame)
      and wisdom (sophia) are one.
    confidence: strong

  - name: "Oroorrothos"
    element: "cold"
    compass: "WEST"
    roots:
      - language: Greek
        root: "reduplicated ὄρος (oros) = boundary/limit + ῥόθος (rothos) = rushing"
        meaning: "boundary upon boundary of rushing"
      - language: Greek
        root: "ὀρρωδέω (orrōdeō) = to dread, to shrink back"
        meaning: "the shrinking-back"
    synthesis: >
      WEST = where the Sun sets, where love withdraws, where the rush
      of life contracts. The reduplicated form IS the definition: oros-
      oros-rothos = boundary repeating upon boundary, with the rush of
      life constrained within them. The West is where the East's
      outward fire meets limit after limit. If the orrōdeō root is
      present: "the shrinking-back rushing" — energy that retreats.
      Both readings converge: the West is the direction of withdrawal,
      contraction, and cooling. Not evil — the necessary opposite pole
      to the East's fire. When the ruling love (East) is good, the
      West is positive natural expression; when East is self-love,
      the West becomes spiritual coldness.
    confidence: moderate

  - name: "Erimacho"
    element: "dryness"
    compass: "NORTH"
    roots:
      - language: Greek
        root: "ἔρημος (erēmos) = desert/abandoned/desolate + μάχη (machē) = battle/struggle"
        meaning: "desert-battle / the battleground of desolation"
    synthesis: >
      NORTH = truth in obscurity, where understanding is dim and
      truth is scarce. Dryness = absence of water = absence of truth.
      The desert is the landscape of spiritual ignorance — where truth
      cannot be found, where the seeker struggles in darkness. The name
      encodes the EXPERIENCE of the North: ἔρημος (abandoned/desolate)
      + μάχη (battle) = the struggle that occurs when truth has
      withdrawn. The North is the desert where you fight to find what
      the South receives freely. Not evil — the necessary condition
      where faith must carry what sight cannot yet confirm.
    confidence: strong

  - name: "Athuro"
    element: "wetness"
    compass: "SOUTH"
    roots:
      - language: Egyptian
        root: "Hathor (Ḥwt-Ḥr) = 'House of Horus' = the house where the light-principle dwells"
        meaning: "the house of light"
    synthesis: >
      SOUTH = truth in full light, flowing uninterrupted. Water =
      truth; wetness = truth abundant. The South is where truth pours
      in without obstruction — the noon Sun of understanding. The
      Egyptian etymology is precise: Ḥwt (house) + Ḥr (Horus, the
      light-principle). The South IS the house where light is AT HOME
      — fully present, fully flowing, nourishing everything it
      reaches. Truth at its fullest is wet: it irrigates, sustains,
      brings every living thing to bloom. The deity Hathor perceived
      at the Egyptian cultural degree is NOT the source — the
      principle of truth-fully-present-and-flowing exists at the
      spiritual level; both are the same reality at different degrees.
      The nourishing quality of Hathor IS the nourishing quality of
      unobstructed truth.
    confidence: moderate

  - name: "Onorthochrasaei"
    element: "mother of the four / matter"
    compass: "CENTER"
    roots:
      - language: Greek
        root: "ὀρθο- (ortho-) = straight/correct + χράω (chraō) = to give oracles; or χράομαι (chraomai) = to use/mix"
        meaning: "the straight-mixing one / the one of correct use"
    synthesis: >
      THE CENTER. "She stands in their midst since she is illimitable,
      and she mixes with all of them. And she is truly matter." If
      ortho- + chraomai: matter is what MIXES all four directions into
      a single correct (ortho) form — the straight blending of East,
      West, South, North into ultimate expression. She makes the
      mixture UPRIGHT — correct, balanced. The material body sits at
      the crossroads. She "mixes with all" because every material
      thing participates in all four directions simultaneously in
      varying proportions. She is "illimitable" because no point in
      the material world escapes this intersection. If chraō (oracle):
      matter is where the four directions SPEAK — where the spiritual
      compass becomes legible in natural form.
    confidence: moderate

# =============================================================================
# SECTION 5: RULERS OF THE FOUR PASSIONS
# =============================================================================

passion_rulers:

  - name: "Ephememphi"
    passion: "pleasure"
    roots:
      - language: Greek
        root: "ἐφήμερος (ephēmeros) = ephemeral/daily + ἔμφασις (emphasis) = appearance"
        meaning: "daily appearance / the ephemeral showing"
    synthesis: >
      Pleasure as the EPHEMERAL — what appears for a day and vanishes.
      The name encodes the transience of pleasure. The pleasure-demon
      is literally called "the-thing-that-lasts-a-day."
    confidence: strong

  - name: "Yoko"
    passion: "desire"
    roots:
      - language: uncertain
        root: "possibly from ζυγός (zygos) = yoke"
        meaning: "the yoke"
    synthesis: >
      Desire as what yokes — what binds and harnesses. To desire is to
      be harnessed to the object. The yoke IS desire at the functional
      level.
    confidence: moderate

  - name: "Nenentophni"
    passion: "grief"
    roots:
      - language: uncertain
        root: "possibly contains νέκυς (nekys) = corpse + τόφος (tophos) = tomb"
        meaning: "corpse-tomb"
    synthesis: >
      Grief as the death-experience — the interior tomb where something
      alive has been buried. Grief IS the lived experience of interior
      death.
    confidence: tentative

  - name: "Blaomen"
    coptic_form: "ⲃⲗ̅ⲁ̅ⲟ̅ⲙ̅ⲏ̅ⲛ̅ ⲡⲉ ⲡⲁⲧⲧϩⲛϩϩⲉ (BLAOMĒN + native Coptic ⲧϩⲛϩϩⲉ for fear)"
    passion: "fear"
    roots:
      - language: Greek
        root: "βλάπτω (blaptō) = to harm + μένος (menos) = spirit/force"
        meaning: "harm-spirit / the spirit of damage"
    synthesis: >
      Fear as the anticipation of harm to one's spirit — not mere
      physical danger but the threat of damage to what animates.
      Fear IS the perception of approaching spiritual harm.
      COPTIC NOTE: Terminal N preserved in the manuscript (ⲃⲗⲁⲟⲙⲏⲛ).
      Crucially, the Coptic body-part term uses NATIVE Coptic ⲧϩⲛϩϩⲉ
      ("fear") rather than Greek φόβος (phobos). This is the same
      pattern seen throughout: the most intimate terms use the
      vernacular, not the borrowed language.
    confidence: moderate

  - name: "Aesthesis-Ouch-Epi-Ptoe"
    passion: "mother of all passions"
    roots:
      - language: Greek (compound)
        root: >
          αἴσθησις (aisthēsis) = sensation/perception
          + οὐχ (ouch) = not
          + ἐπί (epi) = upon
          + πτόη (ptoē) = alarm/fright
        meaning: "sensation-not-upon-alarm"
    synthesis: >
      The MOTHER of all four passions is NEUTRAL SENSATION prior to its
      polarization. "Sensation not upon alarm" = perception before it
      has been activated by any of the four passion-triggers. This is
      the undifferentiated perceptual field from which pleasure, desire,
      grief, and fear emerge as four specializations. The name is a
      complete philosophical definition compressed into angel-name form.
      This is the most sophisticated name in the entire list — a Greek
      compound that is simultaneously a taxonomy and a correspondence.
    confidence: strong

# =============================================================================
# SECTION 6: HEAD OF THE MATERIAL SOUL
# =============================================================================

material_soul_head:

  - name: "Anaro"
    faculty: "insight into the true character of passions"
    roots:
      - language: Greek
        root: "ἀνά (ana) = up/back + ὁράω (horaō) = to see"
        meaning: "the one who sees back / the one who looks up"
    synthesis: >
      Insight (the capacity to see the true nature of passions) is
      named "seeing-back" or "seeing-upward." To see truly IS to look
      back toward the source — to see the correspondence rather than
      only the surface. Anaro is the faculty of CORRESPONDENTIAL
      PERCEPTION: seeing the spiritual reality behind/above the
      natural appearance.
    confidence: strong

# =============================================================================
# SUMMARY
# =============================================================================
#
# Confidence distribution across all translated names:
#   strong:    ~20 names (clear roots, precise semantic fit)
#   moderate:  ~20 names (probable roots, plausible fit)
#   tentative: ~18 names (possible roots, speculative)
#   opaque:    ~4 names (no clear decomposition)
#
# Languages represented: Greek (dominant), Hebrew/Aramaic, Egyptian, mixed
#
# Key patterns discovered:
#
# 1. ANATOMICAL SELF-NAMING: Some angels are simply named with the anatomical
#    term (Meniggesstroeth = meninges, Knyx = knēmē/shin). The spiritual
#    power IS the natural form — the name confirms the correspondence.
#
# 2. FUNCTIONAL NAMING: Most names encode the FUNCTION of the body part at
#    the spiritual degree — not what it looks like, but what it DOES
#    (Asterechme = star-holder for the eye, Biblo = book for the kidneys).
#
# 3. DEITY COGNATES: Where a name shares a root with a deity (Chnoumeninorin/
#    Khnum, Athuro/Hathor), the relationship is not derivation but shared
#    correspondence — the deity and the angel both express the same spiritual
#    principle at different degrees. The deity is the principle perceived
#    through mythological/fallen cognition; the angel name is the principle
#    encoded in correspondential form.
#
# 4. GREEK PHILOSOPHICAL COMPOUNDS: The passion-rulers and their mother
#    (Aesthesis-Ouch-Epi-Ptoe) are Greek philosophical definitions in
#    angel-name dress — evidence of a community thinking in Greek
#    philosophical categories while encoding in correspondential form.
#
# 5. HEBREW THEOPHORIC NAMES: Several names contain אל (El) = God
#    (Achiel, Boabel), encoding the divine presence at each body part.
#
# 6. MULTILINGUAL CONVERGENCE: The list moves fluidly between Greek,
#    Hebrew, and Egyptian roots — evidence of a scholarly community
#    operating at the intersection of these traditions, consistent with
#    the claim of direct access to the "book of Zoroaster" (AJ-009).
#
# 7. GRAND MAN CARTOGRAPHY: The entire list is a MAP OF SPIRITUAL
#    QUALITIES organized through the human form — each name captures
#    a spiritual quality, each quality gives rise to a community of
#    beings who share it, each community sustains a body part in
#    ultimates. Their interrelation mirrors the relational structure
#    of heaven. This is Swedenborg's Maximus Homo (HH §§59-102) encoded
#    in angel-name form from a pre-Christian tradition that had direct
#    access to the same knowledge. The convergence is not borrowing — it
#    is independent observation of the same structure.
